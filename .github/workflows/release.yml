name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag
        run: |
          node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) { console.error('Tag must match package.json version'); process.exit(1); }"
      - run: npm ci
      - name: Build wallet
        run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
          REACT_APP_GIT_SHA: ${{ github.sha }}
      - name: Package static site
        run: zip -r "bytecoin-zero-${GITHUB_REF_NAME}.zip" build
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: bytecoin-zero-${{ github.ref_name }}.zip
