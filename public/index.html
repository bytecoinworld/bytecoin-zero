<!DOCTYPE html>
<html lang="en">
  <head>
    <% if (process.env.NODE_ENV === 'production') { %>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; media-src data:; manifest-src 'self'; worker-src 'self'; child-src 'self'; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval';">
    <% } else { %>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self'; media-src data:; manifest-src 'self'; worker-src 'self'; child-src 'self'; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' 'unsafe-inline';">
    <% } %>
    <meta charset="utf-8">
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Bytecoin Zero is a community-maintained browser wallet for Bytecoin (BCN). Create or restore a wallet, send and receive BCN, and review transaction history.">
    <meta name="keywords" content="Bytecoin, BCN, Bytecoin wallet, Bytecoin web wallet, Bytecoin Zero, BCN wallet, send Bytecoin, receive Bytecoin">
    <meta name="theme-color" content="#f3f6fa">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <title>Bytecoin Zero | Bytecoin (BCN) Web Wallet</title>
    <style>
      #loading {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        padding: 1.25rem;
        background:
          radial-gradient(ellipse at 50% 34%, rgba(238, 66, 135, 0.16), transparent 22rem),
          radial-gradient(ellipse at 12% 88%, rgba(73, 139, 214, 0.1), transparent 26rem),
          linear-gradient(145deg, #fcf8fb 0%, #f1f3fa 54%, #f8f2f7 100%);
        color: #2a1722;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      }

      .loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(100%, 25rem);
        padding: 2.5rem 2rem 2.2rem;
        border: 1px solid rgba(255, 255, 255, 0.85);
        border-radius: 1.6rem;
        background: rgba(255, 255, 255, 0.76);
        box-shadow: 0 28px 80px rgba(49, 35, 57, 0.14), inset 0 1px 0 #fff;
        text-align: center;
        backdrop-filter: blur(18px);
        animation: loadingCardIn 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      .loading-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 7rem;
        height: 7rem;
        margin-bottom: 1.7rem;
      }

      .loading-mark::before,
      .loading-mark::after {
        position: absolute;
        inset: -0.75rem;
        border: 1px solid rgba(238, 66, 135, 0.18);
        border-top-color: #ee4287;
        border-right-color: rgba(66, 181, 222, 0.7);
        border-radius: 50%;
        content: "";
        animation: loadingOrbit 3s linear infinite;
      }

      .loading-mark::after {
        inset: -1.15rem;
        border: 1px dashed rgba(102, 116, 164, 0.3);
        animation-direction: reverse;
        animation-duration: 8s;
      }

      .loading-logo {
        display: block;
        width: 6rem;
        height: 6rem;
        filter: drop-shadow(0 10px 18px rgba(207, 48, 113, 0.28));
        animation: loadingLogoFloat 2.4s ease-in-out infinite;
      }

      .loading-eyebrow {
        margin-bottom: 0.35rem;
        color: #bd3470;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.2em;
      }

      .loading-title {
        margin: 0;
        color: #2a1722;
        font-size: 1.35rem;
        font-weight: 760;
        letter-spacing: -0.035em;
      }

      .loading-message {
        margin: 0.55rem 0 1.45rem;
        color: #786575;
        font-size: 0.87rem;
      }

      .loading-track {
        position: relative;
        width: min(100%, 15rem);
        height: 0.38rem;
        overflow: hidden;
        border-radius: 999px;
        background: #eadde7;
      }

      .loading-track::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, #ee4287, #a853cb 58%, #48b9d1);
        box-shadow: 0 0 16px rgba(238, 66, 135, 0.32);
        content: "";
        animation: loadingSweep 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .loading-caption {
        margin-top: 0.8rem;
        color: #9a8796;
        font-size: 0.68rem;
        letter-spacing: 0.025em;
      }

      @keyframes loadingOrbit {
        to { transform: rotate(360deg); }
      }

      @keyframes loadingLogoFloat {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.035); }
      }

      @keyframes loadingSweep {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(255%); }
      }

      @keyframes loadingCardIn {
        from { opacity: 0; transform: translateY(12px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @media (prefers-color-scheme: dark) {
        #loading {
          background:
            radial-gradient(ellipse at 50% 34%, rgba(238, 66, 135, 0.18), transparent 22rem),
            radial-gradient(ellipse at 12% 88%, rgba(73, 139, 214, 0.11), transparent 26rem),
            linear-gradient(145deg, #111827 0%, #19243a 54%, #211d33 100%);
          color: #fff0f6;
        }

        .loading-card {
          border-color: rgba(255, 255, 255, 0.1);
          background: rgba(27, 38, 58, 0.78);
          box-shadow: 0 28px 80px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }

        .loading-title { color: #fff0f6; }
        .loading-message { color: #c3a6b6; }
        .loading-caption { color: #aa96a8; }
        .loading-track { background: #303b52; }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-card,
        .loading-mark::before,
        .loading-mark::after,
        .loading-logo,
        .loading-track::after {
          animation: none;
        }

        .loading-track::after {
          left: 29%;
        }
      }

      @media (max-width: 480px) {
        .loading-card {
          padding: 2rem 1.35rem 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading" role="status" aria-live="polite" aria-label="Loading Bytecoin Zero">
        <div class="loading-card">
          <div class="loading-mark" aria-hidden="true">
            <svg class="loading-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 215.99 215.99">
              <circle fill="#ee4287" cx="107.99" cy="107.99" r="107.99"/>
              <path fill="#fff" d="M158.2 113.09q-6.37-7.05-18.36-8.75v-.17c7-1.13 12.5-4 16.24-8.59a25.09 25.09 0 0 0 5.82-16.23c0-9.86-3.18-16.56-9.75-21.83s-16.44-7-29.81-7h-50.5v47h-29v18H122c6.23 0 10.91.44 14 2.93s4.67 5.71 4.67 10.47-1.56 8.82-4.67 11.37-7.79 4.23-14 4.23H94.84v-14h-23v32H124c13.26 0 23.4-3.46 30.43-8.84s10.33-13.33 10.33-23.08a25.72 25.72 0 0 0-6.56-17.51zm-39.1-15.62H94.84v-29h24.26c12.47 0 18.7 4.87 18.7 14.5s-6.23 14.5-18.7 14.5z"/>
            </svg>
          </div>
          <span class="loading-eyebrow">BYTECOIN ZERO</span>
          <h1 class="loading-title">Loading Bytecoin Zero...</h1>
          <p class="loading-message">Preparing your wallet experience</p>
          <div class="loading-track" aria-hidden="true"></div>
          <span class="loading-caption">Securely getting things ready</span>
        </div>
      </div>
    </div>

    <noscript>You need to enable JavaScript to run Bytecoin Zero.</noscript>
    <script src="%PUBLIC_URL%/bin/wallet-crypto.js"></script>
    <script src="%PUBLIC_URL%/bin/zero_plus.js"></script>
  </body>
</html>
